# uv toolchain pin for jumbo releases. astral-sh/setup-uv (pinned v7 inside the
# reusable jumbo-publish workflow) reads required-version from this file and
# installs exactly it; uv itself also refuses to run under any other version,
# so local developer builds resolve identically to CI.
#
# Why 0.7.13: the pinned jumbo-publish executor (JumboBuild
# a430410d101541742f445f735c7a28c21627d663) generates resolution-only overlay
# stubs for internal dependencies under deps/ during `jumbo lock`. uv 0.7.13
# builds only the root project in `uv build`; uv >= 0.8 additionally builds
# path-source dependencies, which would try to build those non-buildable
# stubs. Lift this pin only together with an executor that materializes the
# recorded dependency artifacts (jumbo dedup --materialize --deps) before the
# build step.
required-version = "0.7.13"
