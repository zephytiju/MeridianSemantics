# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-semantics"
version = "1.0.0"
description = "Meridian V1 logical schema, resource, data, and metadata semantics"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["meridian-storage-core==1.0.0"]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "hatchling==1.27.0",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://github.com/zephytiju/meridian-storage-semantics#readme"
Issues = "https://github.com/zephytiju/meridian-storage-semantics/issues"
Repository = "https://github.com/zephytiju/meridian-storage-semantics"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/.github",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
